# 本地开发依赖：PostgreSQL + Redis + MinIO，端口只绑定 127.0.0.1。
# 启动：docker compose -f deploy/docker-compose.dev.yml up -d
# 账号密码仅用于本机开发，与 config/config.json 保持一致；生产环境请使用独立凭据。
name: ei-feature-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: ei-feature-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ei_feature
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ei_feature"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ei-feature-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: ei-feature-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pg-data:
  redis-data:
  minio-data:
