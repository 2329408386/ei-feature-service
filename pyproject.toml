[project]
name = "ei-feature-service"
version = "0.1.0"
description = "特征计算服务：特征包管理、腔室绑定、按 run_id 计算特征值"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "redis==7.1.0",
    "minio==7.2.20",
    "pebble==5.2.3",
    "numpy==2.5.5",
    # TODO: GDE SDK 确认包名后加一行 == 固定版本
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "fakeredis==2.41.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
